<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 1 — Accounting Concepts</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f7f0ff,#e9f7ff);color:#24243a}.wrap{width:min(760px,94%);margin:28px auto}.hero{background:linear-gradient(135deg,#7c3aed,#2563eb);color:white;border-radius:24px;padding:26px 22px;text-align:center;box-shadow:0 10px 30px #3830782e}.hero h1{margin:0 0 8px;font-size:clamp(24px,6vw,38px)}.hero p{margin:0}.scorebar{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{background:#ffffff2e;padding:8px 13px;border-radius:999px;font-weight:700}.progress{height:10px;background:#ffffff40;border-radius:999px;overflow:hidden;flex:1;min-width:150px}.progress div{height:100%;width:0;background:white;transition:.25s}.card{margin-top:18px;background:white;border-radius:24px;padding:24px;box-shadow:0 10px 28px #2323461a}.badge{display:inline-block;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:800;margin-bottom:12px}.easy{background:#dcfce7;color:#166534}.tricky{background:#fef3c7;color:#92400e}.sneaky{background:#ffedd5;color:#9a3412}.trap{background:#fee2e2;color:#991b1b}.boss{background:#ede9fe;color:#6d28d9}.q{font-size:21px;line-height:1.45;margin:4px 0 20px;font-weight:800}.options{display:grid;gap:12px}.option{width:100%;border:2px solid #e5e7eb;background:#fafafa;border-radius:15px;padding:14px 16px;font-size:16px;font-weight:700;text-align:left;cursor:pointer}.option:hover:not(:disabled){border-color:#8b5cf6;background:#f5f3ff}.option:disabled{cursor:default}.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#166534}.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#991b1b}.feedback{display:none;margin-top:18px;padding:15px 16px;border-radius:15px;line-height:1.5;font-weight:600}.feedback.show{display:block}.good{background:#ecfdf5;border:1px solid #86efac;color:#166534}.bad{background:#fff1f2;border:1px solid #fda4af;color:#9f1239}.actions{display:flex;justify-content:flex-end;margin-top:18px}.next,.restart{border:0;color:white;padding:13px 18px;border-radius:13px;font-weight:800;cursor:pointer}.next{display:none;background:#111827}.next.show{display:inline-block}.result{display:none;text-align:center}.result.show{display:block}.result h2{font-size:30px;margin:0 0 10px}.bigscore{font-size:54px;font-weight:900;margin:12px}.restart{background:linear-gradient(135deg,#7c3aed,#2563eb)}.small{margin-top:10px;color:#6b7280;font-size:14px}@media(max-width:520px){.card{padding:19px}.q{font-size:18px}}</style></head><body><div class="wrap"><section class="hero"><h1>🎯 QUIZ 1</h1><p>Which Accounting Concept Was Violated? 😈📚</p><div class="scorebar"><div class="pill" id="counter">Question 1/25</div><div class="pill" id="score">Score: 0</div><div class="progress"><div id="fill"></div></div></div></section><section class="card" id="quiz"><div id="area"></div><div class="actions"><button class="next" id="next">Next ➜</button></div></section><section class="card result" id="result"><h2 id="title">🎉 Test Complete!</h2><div class="bigscore" id="final">0/25</div><p id="msg"></p><button class="restart" id="restart">🔄 Try Again</button><div class="small">Tip: Read the explanation after every answer — that's where the A/L marks hide 👀</div></section></div><script>
const qs=[
['🟢 EASY','easy','The owner takes Rs. 10,000 from the business to buy a personal gift, but the accountant records it as “Office Expenses.” Which concept is violated?',['Business Entity Concept','Going Concern Concept','Matching Concept','Materiality Concept'],0,'The owner and the business are separate accounting entities. A personal withdrawal is not a business expense.'],
['🟢 EASY','easy','The business is expected to continue operating normally, but the accountant prepares the accounts using forced-sale values even though there is no evidence that the business will close. Which concept is violated?',['Prudence Concept','Going Concern Concept','Dual Aspect Concept','Consistency Concept'],1,'Going concern assumes the business will continue operating for the foreseeable future unless there is evidence otherwise.'],
['🟡 TRICKY','tricky','Electricity used in December is not recorded as an expense because it will only be paid in January. Which concept is violated?',['Historical Cost Concept','Accrual Concept','Business Entity Concept','Materiality Concept'],1,'Under accrual accounting, expenses are recognized when incurred, not only when cash is paid.'],
['🟡 TRICKY','tricky','A company changes its depreciation method only in a year when the new method makes profit look higher, with no valid reason. Which concept is violated?',['Consistency Concept','Matching Concept','Going Concern Concept','Dual Aspect Concept'],0,'Accounting methods should generally be applied consistently so results can be compared fairly.'],
['🟠 SNEAKY','sneaky','Management expects a large gain next year, so the accountant records that expected gain as income now even though it has not been earned. Which concept is violated?',['Prudence Concept','Business Entity Concept','Historical Cost Concept','Materiality Concept'],0,'Prudence requires caution: expected gains should not be recognized prematurely.'],
['🟠 SNEAKY','sneaky','A machine is bought for Rs. 800,000, but the accountant records it at Rs. 1,000,000 simply because they believe its current value is Rs. 1,000,000. Which concept is violated?',['Accrual Concept','Historical Cost Concept','Matching Concept','Going Concern Concept'],1,'Under the historical cost basis, an asset is initially recorded at the amount paid to acquire it.'],
['🟠 SNEAKY','sneaky','A business buys equipment for cash but records only the decrease in Cash and does not record the equipment. Which concept is violated?',['Dual Aspect Concept','Prudence Concept','Consistency Concept','Materiality Concept'],0,'Every transaction has two aspects. Cash decreases and the equipment asset increases.'],
['🔴 TRAP','trap','The company ignores a Rs. 5 million accounting error because “there are lots of other transactions anyway.” Which concept is violated?',['Materiality Concept','Business Entity Concept','Accrual Concept','Historical Cost Concept'],0,'Material information and significant errors can affect users’ decisions and should not simply be ignored.'],
['🔴 TRAP','trap','Sales revenue from March is recognized in March, but the related cost of the goods sold is deliberately pushed into April to make March profit look bigger. Which concept is violated?',['Matching Concept','Going Concern Concept','Dual Aspect Concept','Business Entity Concept'],0,'Expenses related to a period’s revenue should be recognized in the same period to measure profit properly.'],
['🟡 TRICKY','tricky','The owner pays her personal mobile-phone bill from the business bank account and records it as a business communication expense. Which concept is violated?',['Materiality Concept','Business Entity Concept','Prudence Concept','Matching Concept'],1,'A personal expense of the owner is separate from the expenses of the business.'],
['🟠 SNEAKY','sneaky','A business receives services in December, but the accountant records the expense in January solely because the invoice was paid in January. Which concept is violated?',['Accrual Concept','Historical Cost Concept','Consistency Concept','Going Concern Concept'],0,'The service was received in December, so the related expense belongs to December under accrual accounting.'],
['👑 FINAL BOSS','boss','A sole proprietor buys a luxury watch entirely for personal use. The accountant records it as a business non-current asset just because the proprietor owns the business. Which concept is violated?',['Going Concern Concept','Business Entity Concept','Prudence Concept','Matching Concept'],1,'The business is separate from the owner’s personal affairs. The personal watch is not a business asset.'],
['🟢 EASY','easy','Rent for March is paid in April, but the accountant records the rent expense in April because that is when cash left the bank. Which concept is violated?',['Accrual Concept','Consistency Concept','Dual Aspect Concept','Materiality Concept'],0,'The expense relates to March, so under accrual accounting it should be recognized in March.'],
['🟡 TRICKY','tricky','A business has used the same inventory valuation method for several years, but the accountant changes it this year without a reasonable accounting reason. Which concept is violated?',['Consistency Concept','Prudence Concept','Going Concern Concept','Business Entity Concept'],0,'Consistency supports comparable financial statements by avoiding unjustified changes in accounting methods.'],
['🟠 SNEAKY','sneaky','A company knows that a possible loss is reasonably expected, but the accountant refuses to consider it because “only profits matter.” Which concept is most directly violated?',['Prudence Concept','Historical Cost Concept','Dual Aspect Concept','Business Entity Concept'],0,'Prudence requires caution when dealing with uncertainty and expected losses should be considered appropriately.'],
['🟡 TRICKY','tricky','A vehicle purchased for Rs. 2,400,000 is recorded in the books at Rs. 2,400,000 rather than at an estimated market value of Rs. 2,900,000 at the purchase date. Which concept supports the initial recording?',['Historical Cost Concept','Matching Concept','Accrual Concept','Materiality Concept'],0,'Historical cost supports recording an acquired asset initially at its purchase cost.'],
['🟠 SNEAKY','sneaky','The business receives Rs. 50,000 cash from a customer as an advance for goods to be delivered later, but the accountant records the whole amount immediately as sales revenue. Which concept is most directly relevant to the problem?',['Accrual Concept','Going Concern Concept','Business Entity Concept','Consistency Concept'],0,'Revenue recognition is not based simply on receiving cash; the accounting treatment must reflect when the income is earned.'],
['🔴 TRAP','trap','A small office item costing Rs. 50 is treated as a major separate non-current asset even though its effect on the financial statements is insignificant. Which concept is relevant to this treatment?',['Materiality Concept','Prudence Concept','Dual Aspect Concept','Going Concern Concept'],0,'Materiality allows insignificant items to be treated in a simpler manner when their effect would not influence users’ decisions.'],
['🟡 TRICKY','tricky','The owner contributes Rs. 500,000 cash to start the business. The accountant records the cash increase but does not record the owner’s capital. Which concept is violated?',['Dual Aspect Concept','Matching Concept','Prudence Concept','Going Concern Concept'],0,'The contribution has two aspects: an increase in cash and an increase in the owner’s capital.'],
['🟠 SNEAKY','sneaky','A business receives an electricity bill for services already used during the current accounting period, but the accountant leaves it completely unrecorded because it has not yet been paid. Which concept is violated?',['Accrual Concept','Historical Cost Concept','Business Entity Concept','Consistency Concept'],0,'Accrual accounting recognizes expenses when the related service has been consumed, regardless of payment date.'],
['🔴 TRAP','trap','An accountant records a personal loan taken by the owner as a liability of the business, even though the business did not receive or guarantee the loan. Which concept is violated?',['Business Entity Concept','Materiality Concept','Matching Concept','Historical Cost Concept'],0,'The owner’s personal financial obligations are separate from the business’s obligations.'],
['🟡 TRICKY','tricky','A company continues using its normal accounting basis even though management has no plans to close the business and there is no evidence that it must cease trading. Which concept supports this assumption?',['Going Concern Concept','Prudence Concept','Dual Aspect Concept','Materiality Concept'],0,'Going concern assumes the entity will continue operating rather than being treated as if it is immediately closing.'],
['🟠 SNEAKY','sneaky','A business records the full cost of a three-year insurance policy as an expense in the first month, even though the insurance provides benefits over all three years. Which concept is most directly violated?',['Matching Concept','Business Entity Concept','Historical Cost Concept','Consistency Concept'],0,'Costs should be recognized in the periods that receive the related benefits so that profit is measured appropriately.'],
['👑 FINAL BOSS','boss','An accountant deliberately chooses an accounting treatment that makes this year’s profit look higher by ignoring a known significant expense that relates to this year. Which combination of concepts is most clearly threatened?',['Prudence and Matching Concepts','Business Entity and Going Concern Concepts','Historical Cost and Dual Aspect Concepts','Materiality and Going Concern Concepts'],0,'Ignoring a known significant expense can conflict with prudence and with matching costs to the revenue or period they relate to.']
];
let n=0,s=0,done=false;const area=document.getElementById('area'),next=document.getElementById('next');function render(){done=false;let x=qs[n];document.getElementById('counter').textContent=`Question ${n+1}/25`;document.getElementById('score').textContent=`Score: ${s}`;document.getElementById('fill').style.width=`${n/25*100}%`;next.classList.remove('show');area.innerHTML=`<div class="badge ${x[1]}">${x[0]}</div><div class="q">${x[2]}</div><div class="options">${x[3].map((o,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div class="feedback" id="fb"></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}function answer(i){if(done)return;done=true;let x=qs[n],bs=document.querySelectorAll('.option'),fb=document.getElementById('fb');bs.forEach(b=>b.disabled=true);bs[x[4]].classList.add('correct');if(i===x[4]){s++;fb.className='feedback show good';fb.innerHTML=`✅ <strong>Correct!</strong><br><br>💡 ${x[5]}`}else{bs[i].classList.add('wrong');fb.className='feedback show bad';fb.innerHTML=`❌ <strong>Not this time!</strong> Correct answer: <strong>${x[3][x[4]]}</strong><br><br>💡 ${x[5]}`}document.getElementById('score').textContent=`Score: ${s}`;document.getElementById('fill').style.width=`${(n+1)/25*100}%`;next.classList.add('show')}next.onclick=()=>{if(n<24){n++;render()}else{document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('final').textContent=`${s}/25`;let t=document.getElementById('title'),m=document.getElementById('msg');if(s===25){t.textContent='🏆 PERFECT SCORE!';m.textContent='Okayyy accountant-in-training 😭🔥 Every concept got caught.'}else if(s>=10){t.textContent='🔥 AMAZING!';m.textContent='You’re seriously cooking. Just a couple of traps got you.'}else if(s>=7){t.textContent='😎 SOLID!';m.textContent='Good job! Review the explanations and you’ll be even stronger.'}else{t.textContent='📚 KEEP GOING!';m.textContent='No stress — review the explanations and try again.'}}};document.getElementById('restart').onclick=()=>{n=0;s=0;document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';render()};render();</script></body></html>
